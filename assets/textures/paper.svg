<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <filter id="noise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.65"
      numOctaves="3"
      stitchTiles="stitch"
      result="noise"/>
    <feColorMatrix
      type="saturate"
      values="0"
      in="noise"
      result="grayNoise"/>
    <feBlend
      in="SourceGraphic"
      in2="grayNoise"
      mode="multiply"
      result="blend"/>
  </filter>
  <rect width="256" height="256" fill="#f0ebe0" filter="url(#noise)"/>
</svg>
